name: CI

on:
  push:
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  reference:
    # Proves the Python harness still reproduces simgenv2 bit-for-bit, regenerates
    # the golden files with the pinned libraries, and re-runs the TS tests against them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: reference/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python -m pip install --upgrade pip setuptools wheel
      - run: pip install -r reference/requirements.txt
      - run: python reference/check_fidelity.py 20
      - run: python reference/make_golden.py
      - run: npm ci && npm test
      - name: TS-generated FITS match simgenv2's layout
        run: |
          npm run generate -- --n 10 --seed 7 --out sims_ts
          python reference/check_ts_fits.py sims_ts
